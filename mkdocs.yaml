site_name: SymbChainSim

repo_url: https://github.com/GiorgDiama/SymBChainSim
repo_name: SymbChainSim

theme:
  name: material
  features:
    - announce.dismiss
    - content.code.annotate
    - content.code.copy
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
  font:
    text: Roboto
    code: Roboto Mono

nav:
  - Home: index.md
  - Quick Start: quick_start.md
  - Simulation Engine: simulation_engine.md
  - Blockchain Models:
      - Node: node.md
      - Block: block.md
      - Transaction Factory: transaction_factory.md
      - Network: network.md    
  - Consensus:
    - Conseusus Protocols: consensus.md
    - High-Level Sync: high_level_sync.md
    - Rounds: rounds.md
  - Manager: manager.md
  - Reconfiguration: reconfiguration.md   
  - Parameters: simulation_parameters.md      
      

      