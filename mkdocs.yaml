site_name: SymBChainSim
site_url: https://giorgdiama.github.io/SymBChainSim/

repo_url: https://github.com/GiorgDiama/SymBChainSim
repo_name: SymBChainSim
edit_uri: edit/base/docs/

theme:
  name: material
  features:
    - announce.dismiss
    - content.code.annotate
    - content.code.copy
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
  font:
    text: Roboto
    code: Roboto Mono
  palette: 
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      toggle:
        icon: material/brightness-7 
        name: Switch to dark mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Get started: getting_started.md
  - Tutorials:
      - Compare two runs: tutorials/compare_runs.md
      - Runtime changes: tutorials/runtime_changes.md
      - Run a scenario: tutorials/scenarios.md
  - Concepts:
      - DES in 2 minutes: concepts/des.md
      - How SBS models a blockchain: concepts/blockchain_model.md
      - How consensus is modelled: concepts/consensus.md
  - Reference:
      - Configuration: reference/configuration.md
      - Extending SBS: reference/extending.md
      - Using SBS with an agent: reference/agents.md
