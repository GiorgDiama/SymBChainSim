site_name: SymBChainSim
site_url: https://giorgdiama.github.io/SymBChainSim/

repo_url: https://github.com/GiorgDiama/SymBChainSim
repo_name: SymBChainSim
edit_uri: edit/base/docs/

theme:
  name: material
  logo: assets/icon.png
  favicon: assets/favicon.png
  features:
    - announce.dismiss
    - content.code.annotate
    - content.code.copy
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
  font:
    text: Roboto
    code: Roboto Mono
  palette: 
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      toggle:
        icon: material/brightness-7 
        name: Switch to dark mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Get started: getting_started.md
  - Tutorials:
      - Compare two runs: tutorials/compare_runs.md
      - Runtime changes: tutorials/runtime_changes.md
      - Generate and use scenarios: tutorials/scenarios.md
  - Concepts:
      - Overview: concepts/overview.md
      - The simulation engine: concepts/simulation_engine.md
      - Nodes, blocks and transactions: concepts/nodes_blocks_transactions.md
      - The network: concepts/network.md
      - Consensus: concepts/consensus.md
      - The Manager: concepts/manager.md
      - Reconfiguration: concepts/reconfiguration.md
  - How-to guides:
      - Extending SBS: how_to/extending.md
      - Using SBS with an agent: how_to/agents.md
  - Reference:
      - Configuration: reference/configuration.md
      - Metrics: reference/metrics.md
