site_name: SymbChainSim

repo_url: https://github.com/GiorgDiama/SymBChainSim
repo_name: SymbChainSim

theme:
  name: material
  features:
    - announce.dismiss
    - content.code.annotate
    - content.code.copy
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
  font:
    text: Roboto
    code: Roboto Mono
  palette: 
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      toggle:
        icon: material/brightness-7 
        name: Switch to dark mode

nav:
  - Home: index.md
  - Quick Start: quick_start.md
  - Simulation Engine: simulation_engine.md
  - Blockchain Models:
      - Node: node.md
      - Block: block.md
      - Transaction Factory: transaction_factory.md
      - Network: network.md    
  - Consensus:
    - Consensus Protocols: consensus.md
    - High-Level Sync: high_level_sync.md
    - Rounds: rounds.md
  - Manager:
    - Manager: manager.md
    - Dynamic Simulation: dynamic_simulation.md
  - Reconfiguration: reconfiguration.md   
  - Metrics: metrics.md
  - Scenarios: scenarios.md
  - Parameters: simulation_parameters.md      
      

      