simulation:
  # Initial consensus protocol to use at simulation start
  #   Options: "PBFT", "Tendermint", "BigFoot"
  init_CP: "PBFT"
  
  # Stop simulation after this many seconds (-1 = no limit)
  simTime: 1800
  
  # Stop simulation after this many blocks are produced (-1 = no limit)
  stop_after_blocks: -1
  
  # Stop simulation after this many transactions are processed (-1 = no limit)
  stop_after_tx: -1
  
  # Enable detailed debugging mode (step-by-step event processing mode)
  debugging_mode: False
  
  # Logging verbosity level: "DEBUG" or "INFO"
  logging_level: "INFO"
  
  # Print simulation progress every N seconds
  print_every: 100
  
  # Take snapshots of simulation state every N seconds
  snapshot_interval: 30
  
  # Print simulation simulation information at the start of execution
  print_info: True
  
application:
  # Number of nodes in the blockchain network
  Nn: 16
  
  # Workload generation mode: 
  #   'generate': generate based on parameters
  #   'path_to_workload_trace': use transitions from the trace
  workload: 'generate'
  
  # Transaction generation interval (every N seconds generate transactions for the next N seconds)
  TI_dur: 10
  
  # Total number of transactions to generate per second
  Tn: 180
  
  # Base size of transactions in MB
  base_transaction_size: 0.0016
  
  # Transaction size variation in MB (standard deviation)
  Tsize: 0.0008
  
  # Transaction pool model:
  #   "global": abstracted model with only 1 global pool (accuracy of this model is evaluated in the TOMACS paper)
  #   "local: each nodes gets its own transaction pool (slower)
  transaction_model: "global"

execution:
  # Time required to create a block in seconds
  creation_time: 0.02
  
  # Time required for block validation in seconds
  block_val_delay: 0.01
  
  # Time required to validate a network message in seconds
  msg_val_delay: 0.001
  
  # Time required to requests missing data from a peer (seconds)
  sync_message_request_delay: 0.1
  
  # Time required to validate each transaction in a received blocks (seconds)
  time_per_tx: 0.001
  
  # Proposer selection algorithm: 
  #   "hash": pseudorandom based on the hash of the latest block
  #   "round_robin": round robin 
  proposer_selection: "hash"

data:
  # Maximum block size in MBs
  Bsize: 1
  
  # Base block size in MB (excluding transactions)
  base_block_size: 0.002
  
  # Min. time interval between blocks in seconds
  block_interval: 0.2

network:
  # Base message size in MB
  base_msg_size: 0.1
  
  # Enable gossip protocol for message propagation
  #   True: messages are disseminated through cascading peer multicast
  #   False: full network broadcasts (regardless on num_neighbors)
  gossip: True
  
  # Number of neighbors each node connects to
  num_neighbours: 6
  
  # Latency model: 
  # "measured": based on dataset
  # "distance": calculated based on geographical distance 
  # "local": uses only local model 
  # "off": no additional delay 
  use_latency: "measured"
  
  # Latency for nodes in the same city in milliseconds
  same_city_latency_ms: 5
  
  # Standard deviation for same-city latency in milliseconds
  same_city_dev_ms: 0
  
  # Additional queueing delay in seconds
  queueing_delay: 0
  
  # Additional processing delay in seconds
  processing_delay: 0

  bandwidth:
    # Mean bandwidth in Mbps
    mean: 5
    
    # Standard deviation of bandwidth in Mbps
    dev: 2
    
    # Minimum bandwidth in Mbps
    min: 2
    
    # Bandwidth sampling frequency: 
    #   'always': sample from the distribution always,
    #   'once': sample once
    #   'scenario': never, scenario logic handles network state
    sample: 'always'
    
consensus:
  # Path to consensus protocol specific configurations 
  BigFoot: Chain/Consensus/BigFoot/BigFoot_config.yaml
  PBFT: Chain/Consensus/PBFT/PBFT_config.yaml
  Tendermint: Chain/Consensus/Tendermint/TM_config.yaml

behaviour:
  # Enable behavioral modeling
  use: False
  
  # Path to behavior configuration file
  config: "../Configs/behaviour_config.yaml"
  
  # Print behavior updates during simulation
  print_updates: True

dynamic_sim:
  # Enable dynamic simulation features
  use: False
  
  # Path to dynamic simulation configuration file
  config: "../Configs/dynamic_config.yaml"
  
  # Print dynamic simulation updates during execution
  print_updates: True

reconfiguration:
  # Enable reconfiguration of blockchain system
  reconfigure: True

  # How often to reconfigure the system
  reconfiguration_interval: 300

  # Block size of produced configuration blocks in MB
  conf_block_size: 0.25

  # How to reconfigure the system
  #   "random_centralised": randomly picks confiugration from "random_configuration" every reconfiguration interval
  reconfiguration_method: 'random_centralised'

  # list of configuration parameters used to randomly reconfigure the blockchain
  random_configuration:
    protocols: ["PBFT", "BigFoot", "Tendermint"]
    block_sizes: [0.5, 1, 2, 4]
    block_times: [0.1, 0.2, 0.5, 1]

  # controls whether: 
  #   a) (False) the configuration block is instantly added to the configuration chains of all nodes
  #   b) (True)  added to a percentage of the nodes (after a small delay) and gossiped to all other nodes
  propagation:
    model: True
    delay: [0.02, 0.1]
    per_cent_nodes: 0.4    

  # controls printing the details of the reconfiguration 
  print_updates: True